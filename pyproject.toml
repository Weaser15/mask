[build-system]
requires = ["uv_build>=0.12.7"]
build-backend = "uv_build"

[project]
name = "mask"
version = "0.1.0"
authors = [
  { name = "Szymon Oramus", email = "oramusszymon@gmail.com" },
]
description = "Package to create masks for micromagnetic simulations."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "NPY",      # numpy-specific
    "PTH",      # use pathlib
    "RUF",      # ruff's own
]
ignore = [
    "E501",     # line length — the formatter owns this
    "E741",     # ambiguous names: l, I, O
    "B905",     # zip() strict= — noisy in numeric code
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]           # asserts are the point
"**/__init__.py" = ["F401"]    # re-exports

[tool.ruff.format]
docstring-code-format = true
